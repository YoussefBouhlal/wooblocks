name: Theme Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-standards:
    name: PHP Standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer lint

  php-syntax:
    name: PHP Syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check every theme PHP file
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

  assets:
    name: JavaScript, CSS And Theme JSON
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run lint:json

  theme-check:
    name: Theme Check (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.7', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli:2.12.0
          coverage: none
        env:
          fail-fast: 'true'
      - name: Verify WP-CLI
        run: wp --version
      - name: Install disposable WordPress and Theme Check
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/wordpress"
          wp core download --path="$site" --version="$WP_VERSION" --skip-content
          wp config create --path="$site" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$site" --url=http://localhost --title=Checks --admin_user=checks --admin_password=ci-only-password --admin_email=checks@example.org --skip-email
          wp plugin install theme-check --version=20260901 --activate --path="$site"
          theme="$site/wp-content/themes/wooblocks"
          mkdir -p "$theme"
          cp functions.php style.css theme.json README.md readme.txt screenshot.png "$theme/"
          cp -R assets parts patterns templates "$theme/"
      - name: Check runtime theme files
        run: wp theme-check run wooblocks --path="$RUNNER_TEMP/wordpress"

  required:
    name: Automated Checks
    if: ${{ always() }}
    needs: [php-standards, php-syntax, assets, theme-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success'
